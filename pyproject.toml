# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image2-workbench"
version = "0.3.5"
description = "Spec-first gpt-image-2 workbench: bilingual prompt packs, CLI/Skill workflows, cost estimates, preflight validation, and run ledger."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-CONTENT", "LICENSE-CC-BY-4.0", "NOTICE"]
authors = [
    {name = "image2-workbench contributors"},
]
keywords = [
    "openai",
    "gpt-image-2",
    "image-generation",
    "python",
    "cli",
    "agent-skill",
    "prompt-engineering",
    "templates",
    "generative-ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "openai>=1.55,<2",
    "typer[all]>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6",
    "rich>=13",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
i2w = "image2_workbench.cli:app"

[project.urls]
Homepage = "https://github.com/image2-workbench/image2-workbench"
Issues = "https://github.com/image2-workbench/image2-workbench/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
image2_workbench = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
