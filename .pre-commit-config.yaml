#
# Pre-commit hooks for image2-workbench.
#
# First-time setup (run from repo root):
#   pip install pre-commit       # if not already installed
#   pre-commit install           # wires hooks into .git/hooks/pre-commit
#
# To run all hooks against every file in the repo (e.g. after onboarding):
#   pre-commit run --all-files
#
# Mypy is intentionally NOT in this config — it's slow on every commit.
# Run it separately in CI or via `make typecheck`.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
