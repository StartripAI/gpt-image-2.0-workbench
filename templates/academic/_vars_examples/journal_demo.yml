paper_title: "Sparse Attention Routing in Long-Context Language Models"
authors: "L. Park, R. Okafor, M. Tanaka — Stanford NLP Group"
intro_summary: "Long-context transformers face quadratic compute; we ask whether routed sparsity preserves recall."
methods_summary: "We trained 1.3B-parameter models with top-k token routing across 32k-token windows on 64 A100 GPUs."
results_summary: "Routed-sparse variants matched dense baselines on RULER while reducing FLOPs by 41% at 32k context."
conclusion_summary: "Static routing is competitive; dynamic per-head routing is the most promising next direction."
figure_caption_1: "Per-layer routing entropy across training steps."
figure_caption_2: "RULER recall vs. FLOPs at 4k, 16k, 32k context lengths."
