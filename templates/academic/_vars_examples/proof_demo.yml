theorem_name: "Theorem (Cauchy-Schwarz Inequality)"
step_1: "For all u, v in inner product space V, define f(t) = ||u + tv||^2"
step_2: "Expand: f(t) = ||v||^2 t^2 + 2 Re<u,v> t + ||u||^2 >= 0 for all t in R"
step_3: "Discriminant non-positive: (2 Re<u,v>)^2 - 4 ||u||^2 ||v||^2 <= 0"
step_4: "Therefore |<u,v>| <= ||u|| ||v||; equality iff dependent"
final_line: "Q.E.D."
