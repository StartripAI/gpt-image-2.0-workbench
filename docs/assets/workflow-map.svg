<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Spec-first workflow map</title>
  <desc id="desc">A workflow diagram showing templates compiled into prompts, checked by preflight, rendered, and recorded in a ledger.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef6f4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
    <style>
      .title{font:700 28px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .label{font:700 18px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .body{font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .mono{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
    </style>
  </defs>
  <rect width="1280" height="430" rx="24" fill="url(#panel)"/>
  <text x="52" y="62" class="title">One template definition, three usable surfaces</text>
  <text x="52" y="92" class="body">Keep prompt packs executable: compile once, run in terminals, agent skills, or paste-ready markdown.</text>

  <g transform="translate(52 145)">
    <rect width="210" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="22" y="32" class="label">Skill</text>
    <text x="22" y="58" class="body">agent-triggered wrapper</text>
    <rect y="105" width="210" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="22" y="137" class="label">CLI / SDK</text>
    <text x="22" y="163" class="body">scriptable workflow</text>
    <rect y="210" width="210" height="78" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="22" y="242" class="label">Prompt-only</text>
    <text x="22" y="268" class="body">copy-paste markdown</text>
  </g>

  <path d="M282 184 C330 184 338 250 384 250" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M282 289 C330 289 338 250 384 250" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M282 394 C330 394 338 250 384 250" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" transform="translate(0 -105)"/>

  <g transform="translate(405 168)">
    <rect width="226" height="164" rx="18" fill="#0f172a"/>
    <text x="24" y="38" fill="#f8fafc" class="label">Spec DSL</text>
    <text x="24" y="70" fill="#cbd5e1" class="mono">subject:</text>
    <text x="24" y="95" fill="#cbd5e1" class="mono">composition:</text>
    <text x="24" y="120" fill="#cbd5e1" class="mono">text_blocks:</text>
    <text x="24" y="145" fill="#cbd5e1" class="mono">quality_policy:</text>
  </g>
  <path d="M650 250 L738 250" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(760 126)">
    <rect width="192" height="74" rx="16" fill="#ffffff" stroke="#99f6e4"/>
    <text x="20" y="32" class="label">Compiler</text>
    <text x="20" y="56" class="body">bilingual prompts</text>
    <rect y="103" width="192" height="74" rx="16" fill="#ffffff" stroke="#99f6e4"/>
    <text x="20" y="135" class="label">Preflight</text>
    <text x="20" y="159" class="body">reject bad calls first</text>
    <rect y="206" width="192" height="74" rx="16" fill="#ffffff" stroke="#99f6e4"/>
    <text x="20" y="238" class="label">Render / Batch</text>
    <text x="20" y="262" class="body">images, sidecars</text>
  </g>
  <path d="M970 250 L1048 250" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(1070 150)">
    <rect width="158" height="200" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="24" y="40" class="label">Ledger</text>
    <text x="24" y="76" class="mono">success_rate</text>
    <text x="24" y="106" class="mono">p95_latency</text>
    <text x="24" y="136" class="mono">cost_usd</text>
    <text x="24" y="166" class="mono">error_code</text>
  </g>
</svg>
