<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Production controls</title>
  <desc id="desc">A dashboard-style visual showing cost estimates, preflight validation, and ledger observability.</desc>
  <defs>
    <style>
      .h{font:800 28px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .k{font:700 18px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#0f172a}
      .t{font:15px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;fill:#475569}
      .m{font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#334155}
    </style>
  </defs>
  <rect width="1280" height="430" rx="24" fill="#f8fafc"/>
  <text x="52" y="60" class="h">Production controls that prompt galleries usually leave to you</text>
  <text x="52" y="92" class="t">Budget before generation, block known-bad requests locally, and query what happened after a run.</text>

  <g transform="translate(52 136)">
    <rect width="356" height="230" rx="20" fill="#ffffff" stroke="#dbe4ee"/>
    <rect width="356" height="58" rx="20" fill="#ecfeff"/>
    <text x="24" y="38" class="k">Cost matrix</text>
    <text x="24" y="88" class="m">size        quality   usd</text>
    <line x1="24" y1="104" x2="328" y2="104" stroke="#e2e8f0"/>
    <text x="24" y="132" class="m">1024x1024  low       0.0060</text>
    <text x="24" y="162" class="m">1024x1024  medium    0.0530</text>
    <text x="24" y="192" class="m">1536x1024  high      0.2500</text>
    <text x="24" y="218" fill="#0f766e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700">grand_total_usd=$0.5910</text>
  </g>

  <g transform="translate(462 136)">
    <rect width="356" height="230" rx="20" fill="#ffffff" stroke="#dbe4ee"/>
    <rect width="356" height="58" rx="20" fill="#fef3c7"/>
    <text x="24" y="38" class="k">Preflight validation</text>
    <text x="24" y="88" class="m">VALIDATION=4</text>
    <text x="24" y="120" class="m">transparent_bg_unsupported</text>
    <text x="24" y="152" class="m">input_fidelity_unsupported</text>
    <text x="24" y="184" class="m">invalid_size</text>
    <rect x="24" y="202" width="170" height="12" rx="6" fill="#f59e0b"/>
    <rect x="204" y="202" width="110" height="12" rx="6" fill="#fde68a"/>
  </g>

  <g transform="translate(872 136)">
    <rect width="356" height="230" rx="20" fill="#ffffff" stroke="#dbe4ee"/>
    <rect width="356" height="58" rx="20" fill="#dcfce7"/>
    <text x="24" y="38" class="k">Run ledger</text>
    <text x="24" y="88" class="m">template: business_swot_card</text>
    <text x="24" y="120" class="m">success_rate: 92%</text>
    <text x="24" y="152" class="m">p95_latency_ms: 1840</text>
    <text x="24" y="184" class="m">cost_per_output: 0.053</text>
    <text x="24" y="216" class="m">top_error: moderation_blocked</text>
  </g>
</svg>
