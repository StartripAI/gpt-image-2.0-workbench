<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="pc-title pc-desc" preserveAspectRatio="xMidYMid meet">
  <title id="pc-title">production controls capability matrix</title>
  <desc id="pc-desc">Bar chart for four pillars (cost, preflight, batch, ledger) across three tiers (manual, opt-in, shipped); image2-workbench ships all four.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#94A3B8"/>
      <stop offset="1" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <text x="40" y="40" font-family="sans-serif" font-size="20" font-weight="800" fill="#0E2A4D">Production controls &#8212; capability matrix</text>
  <text x="40" y="62" font-family="sans-serif" font-size="13" fill="#475569">Four pillars, three tiers. Bars stack: manual at the base, opt-in in the middle, shipped on top.</text>
  <g font-family="sans-serif">
    <line x1="40" y1="320" x2="1160" y2="320" stroke="#94A3B8"/>
    <line x1="40" y1="100" x2="40" y2="320" stroke="#94A3B8"/>
    <text x="32" y="324" text-anchor="end" font-size="10" fill="#475569">0</text>
    <text x="32" y="247" text-anchor="end" font-size="10" fill="#475569">manual</text>
    <text x="32" y="178" text-anchor="end" font-size="10" fill="#475569">opt-in</text>
    <text x="32" y="108" text-anchor="end" font-size="10" fill="#475569">shipped</text>
  </g>
  <g font-family="sans-serif">
    <g transform="translate(140 100)">
      <rect y="180" width="120" height="40" rx="4" fill="url(#g3)"/>
      <rect y="100" width="120" height="80" rx="4" fill="url(#g2)"/>
      <rect width="120" height="100" rx="4" fill="url(#g1)"/>
      <text x="60" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#0E2A4D">SHIPPED</text>
      <text x="60" y="240" text-anchor="middle" font-size="14" font-weight="800" fill="#0E2A4D">Cost</text>
      <text x="60" y="256" text-anchor="middle" font-size="11" fill="#475569">i2w cost compare</text>
    </g>
    <g transform="translate(380 100)">
      <rect y="180" width="120" height="40" rx="4" fill="url(#g3)"/>
      <rect y="100" width="120" height="80" rx="4" fill="url(#g2)"/>
      <rect width="120" height="100" rx="4" fill="url(#g1)"/>
      <text x="60" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#0E2A4D">SHIPPED</text>
      <text x="60" y="240" text-anchor="middle" font-size="14" font-weight="800" fill="#0E2A4D">Preflight</text>
      <text x="60" y="256" text-anchor="middle" font-size="11" fill="#475569">i2w preflight</text>
    </g>
    <g transform="translate(620 100)">
      <rect y="180" width="120" height="40" rx="4" fill="url(#g3)"/>
      <rect y="100" width="120" height="80" rx="4" fill="url(#g2)"/>
      <rect width="120" height="100" rx="4" fill="url(#g1)"/>
      <text x="60" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#0E2A4D">SHIPPED</text>
      <text x="60" y="240" text-anchor="middle" font-size="14" font-weight="800" fill="#0E2A4D">Batch</text>
      <text x="60" y="256" text-anchor="middle" font-size="11" fill="#475569">i2w batch sweep</text>
    </g>
    <g transform="translate(860 100)">
      <rect y="180" width="120" height="40" rx="4" fill="url(#g3)"/>
      <rect y="100" width="120" height="80" rx="4" fill="url(#g2)"/>
      <rect width="120" height="100" rx="4" fill="url(#g1)"/>
      <text x="60" y="56" text-anchor="middle" font-size="13" font-weight="800" fill="#0E2A4D">SHIPPED</text>
      <text x="60" y="240" text-anchor="middle" font-size="14" font-weight="800" fill="#0E2A4D">Ledger</text>
      <text x="60" y="256" text-anchor="middle" font-size="11" fill="#475569">i2w ledger query</text>
    </g>
  </g>
  <g transform="translate(40 290)" font-family="sans-serif">
    <rect width="14" height="14" rx="2" fill="url(#g1)"/>
    <text x="22" y="11" font-size="11" fill="#0E2A4D" font-weight="600">shipped today</text>
    <rect x="140" width="14" height="14" rx="2" fill="url(#g2)"/>
    <text x="162" y="11" font-size="11" fill="#0E2A4D" font-weight="600">opt-in flag</text>
    <rect x="260" width="14" height="14" rx="2" fill="url(#g3)"/>
    <text x="282" y="11" font-size="11" fill="#0E2A4D" font-weight="600">manual / external</text>
  </g>
</svg>
