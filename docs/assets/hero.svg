    <rect x="22" y="56" width="120" height="10" rx="3" fill="#1f6feb"/>
    <rect x="22" y="74" width="356" height="6" rx="3" fill="#94A3B8"/>
    <rect x="22" y="86" width="320" height="6" rx="3" fill="#94A3B8"/>
    <rect x="22" y="98" width="280" height="6" rx="3" fill="#94A3B8"/>
    <rect x="22" y="118" width="80" height="10" rx="3" fill="#14b8a6"/>
    <rect x="22" y="136" width="356" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="22" y="148" width="300" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="22" y="160" width="346" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="22" y="178" width="64" height="6" rx="3" fill="#CBD5E1"/>
