</g>
<g>
<rect x="166" y="78" width="124" height="104" rx="4" fill="#1f6feb" opacity="0.92"/>
<rect x="178" y="92" width="50" height="6" rx="3" fill="#F5EFE0"/>
<rect x="178" y="106" width="98" height="3" rx="1" fill="#F5EFE0" opacity="0.65"/>
