<rect x="178" y="130" width="70" height="3" rx="1" fill="#F5EFE0" opacity="0.65"/>
</g>
<g>
<rect x="30" y="194" width="124" height="104" rx="4" fill="#F5EFE0" opacity="0.95"/>
<rect x="42" y="208" width="50" height="6" rx="3" fill="#1f6feb"/>
<rect x="42" y="222" width="98" height="3" rx="1" fill="#0E2A4D" opacity="0.45"/>
<rect x="42" y="230" width="86" height="3" rx="1" fill="#0E2A4D" opacity="0.45"/>
<rect x="42" y="238" width="92" height="3" rx="1" fill="#0E2A4D" opacity="0.45"/>
<rect x="42" y="246" width="70" height="3" rx="1" fill="#0E2A4D" opacity="0.45"/>
</g>
<g>
<rect x="166" y="194" width="124" height="104" rx="4" fill="#0B1F3A" stroke="#14b8a6" stroke-width="1.2"/>
<rect x="178" y="208" width="50" height="6" rx="3" fill="#14b8a6"/>
<rect x="178" y="222" width="98" height="3" rx="1" fill="#E2E8F0" opacity="0.55"/>
<rect x="178" y="230" width="86" height="3" rx="1" fill="#E2E8F0" opacity="0.55"/>
<rect x="178" y="238" width="92" height="3" rx="1" fill="#E2E8F0" opacity="0.55"/>
<rect x="178" y="246" width="70" height="3" rx="1" fill="#E2E8F0" opacity="0.55"/>
</g>
