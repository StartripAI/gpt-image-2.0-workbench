<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" role="img" aria-labelledby="hero-title hero-desc" preserveAspectRatio="xMidYMid meet">
<title id="hero-title">image2-workbench: spec-first generative image workbench</title>
<desc id="hero-desc">A wide editorial banner showing a yaml spec panel on the left, the image2-workbench wordmark in the center with stat chips for 30 domains and 80 templates, and a schematic render output with a ledger receipt on the right.</desc>
<defs>
<linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
<stop offset="0" stop-color="#0E2A4D"/>
<stop offset="1" stop-color="#0B1F3A"/>
</linearGradient>
<linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#F5EFE0"/>
<stop offset="1" stop-color="#E8DFC8"/>
</linearGradient>
<linearGradient id="chip" x1="0" x2="0" y1="0" y2="1">
<stop offset="0" stop-color="#F5EFE0"/>
<stop offset="1" stop-color="#E2E8F0"/>
</linearGradient>
<linearGradient id="flow" x1="0" x2="1">
<stop offset="0" stop-color="#14b8a6"/>
<stop offset="1" stop-color="#1f6feb"/>
</linearGradient>
<linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
<stop offset="0" stop-color="#1f6feb"/>
<stop offset="1" stop-color="#14b8a6"/>
</linearGradient>
<radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#14b8a6" stop-opacity="0.22"/>
<stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
</radialGradient>
<pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
<circle cx="2" cy="2" r="1.1" fill="#7DD3FC" opacity="0.08"/>
</pattern>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
<path d="M0,0 L8,3 L0,6 z" fill="#1f6feb"/>
</marker>
</defs>

<rect width="1600" height="600" fill="url(#bg)"/>
<rect width="1600" height="600" fill="url(#dots)"/>
<ellipse cx="800" cy="300" rx="520" ry="260" fill="url(#spot)"/>

<!-- LEFT ZONE: spec panel -->
<g transform="translate(48 96)">
<rect x="6" y="8" width="396" height="408" rx="14" fill="#000" opacity="0.18"/>
<rect width="396" height="408" rx="14" fill="url(#paper)"/>
<rect width="396" height="40" rx="14" fill="#D7CDB2"/>
<rect y="26" width="396" height="14" fill="#D7CDB2"/>
<circle cx="20" cy="20" r="5" fill="#D97757"/>
<circle cx="40" cy="20" r="5" fill="#E1AD55"/>
<circle cx="60" cy="20" r="5" fill="#7FA670"/>
<text x="200" y="25" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#5C5340" font-weight="600">image2-workbench/templates/swot_card.yml</text>
<g font-family="ui-monospace, monospace" font-size="15" fill="#0E2A4D">
<text x="22" y="78"><tspan fill="#1f6feb" font-weight="700">subject</tspan>: <tspan fill="#5C5340">"acme-coffee-roasters"</tspan></text>
<text x="22" y="108"><tspan fill="#1f6feb" font-weight="700">composition</tspan>:</text>
<text x="40" y="130" fill="#5C5340">layout: 2x2-quadrants</text>
<text x="40" y="150" fill="#5C5340">aspect: 3:2</text>
<text x="22" y="178"><tspan fill="#1f6feb" font-weight="700">text_blocks</tspan>:</text>
<text x="40" y="200" fill="#5C5340">- slot: title</text>
<text x="56" y="220" fill="#0E2A4D" opacity="0.55">text: "Strategic Snapshot"</text>
<text x="40" y="240" fill="#5C5340">- slot: quadrants</text>
<text x="22" y="268"><tspan fill="#1f6feb" font-weight="700">quality_policy</tspan>:</text>
<text x="40" y="290" fill="#5C5340">moderation: auto</text>
<text x="40" y="310" fill="#5C5340">text_max_chars: 80</text>
<text x="22" y="338"><tspan fill="#1f6feb" font-weight="700">artifact</tspan>:</text>
<text x="40" y="360" fill="#5C5340">size: 1536x1024</text>
<text x="40" y="380" fill="#5C5340">background: opaque</text>
</g>
<rect x="22" y="392" width="80" height="6" rx="3" fill="#14b8a6" opacity="0.85"/>
</g>

<!-- CENTER ZONE: wordmark + chips -->
<g text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
<text x="800" y="148" font-size="14" letter-spacing="5" fill="#14b8a6" font-weight="700">SPEC-FIRST &#183; BILINGUAL &#183; AUDITABLE</text>
<text x="800" y="248" font-size="92" font-weight="800" fill="#F8FAFC" letter-spacing="-2">image2-workbench</text>
<text x="800" y="298" font-size="30" font-weight="500" fill="#E2E8F0" opacity="0.92">spec <tspan fill="#14b8a6">&#8594;</tspan> render <tspan fill="#1f6feb">&#8594;</tspan> output</text>
<line x1="600" y1="328" x2="1000" y2="328" stroke="#94A3B8" stroke-width="1" opacity="0.45"/>
</g>

<!-- Stat chips -->
<g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" text-anchor="middle">
<g transform="translate(496 358)">
<rect width="140" height="42" rx="21" fill="url(#chip)"/>
<text x="70" y="27" fill="#0E2A4D">30 domains</text>
</g>
<g transform="translate(648 358)">
<rect width="148" height="42" rx="21" fill="url(#chip)"/>
<text x="74" y="27" fill="#0E2A4D">80 templates</text>
</g>
<g transform="translate(808 358)">
<rect width="140" height="42" rx="21" fill="url(#chip)"/>
<text x="70" y="27" fill="#0E2A4D">7 runtimes</text>
</g>
<g transform="translate(960 358)">
<rect width="120" height="42" rx="21" fill="url(#chip)"/>
<text x="60" y="27" fill="#0E2A4D">bilingual</text>
</g>
</g>

