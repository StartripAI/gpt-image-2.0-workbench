    <text x="80" y="186" font-size="84" font-weight="800" fill="#F8FAFC">image2-workbench</text>
    <text x="80" y="232" font-size="22" fill="#94A3B8">A production workbench for OpenAI gpt-image-2</text>
    <text x="80" y="306" font-size="16" letter-spacing="3" fill="#94A3B8">ATLAS</text>
    <text x="80" y="358" font-size="56" font-weight="800" fill="#14b8a6">16 DOMAINS</text>
    <text x="80" y="408" font-size="56" font-weight="800" fill="#1f6feb">52 TEMPLATES</text>
    <text x="80" y="458" font-size="56" font-weight="800" fill="#F8FAFC">12 CARDS</text>
  </g>
  <g transform="translate(80 482)">
