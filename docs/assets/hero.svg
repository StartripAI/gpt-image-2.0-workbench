    <text x="22" y="40" font-size="14" font-weight="700" fill="#14b8a6">LEDGER</text>
    <line x1="22" y1="52" x2="168" y2="52" stroke="#1f6feb" stroke-width="1" opacity="0.4"/>
    <text x="22" y="76" font-size="11" fill="#94A3B8">success_rate</text>
    <text x="168" y="76" text-anchor="end" font-size="11" fill="#F8FAFC" font-weight="700">94%</text>
