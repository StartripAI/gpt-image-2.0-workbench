<?xml version="1.0" encoding="UTF-8"?>
<!-- SPDX-License-Identifier: CC-BY-4.0 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="wf-title wf-desc" preserveAspectRatio="xMidYMid meet">
  <title id="wf-title">image2-workbench workflow</title>
  <desc id="wf-desc">Three-stage flow: spec yaml is rendered into a markdown prompt, sent to the Images API, and recorded in a ledger.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L11,7 L0,14 z" fill="#1f6feb"/>
    </marker>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <text x="40" y="40" font-family="sans-serif" font-size="20" font-weight="800" fill="#0E2A4D">spec &#8594; render &#8594; output</text>
  <text x="40" y="64" font-family="sans-serif" font-size="13" fill="#475569">A single yaml spec compiles to a bilingual prompt and drives the Images API.</text>
  <g transform="translate(40 100)">
    <rect width="260" height="160" rx="14" fill="#0E2A4D"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#14b8a6">STAGE 1</text>
    <text x="20" y="60" font-family="sans-serif" font-size="22" font-weight="800" fill="#F8FAFC">spec.yml</text>
    <line x1="20" y1="74" x2="240" y2="74" stroke="#1f6feb" stroke-width="1" opacity="0.5"/>
    <text x="20" y="94" font-family="sans-serif" font-size="12" fill="#94A3B8">subject:</text>
    <text x="20" y="112" font-family="sans-serif" font-size="12" fill="#94A3B8">composition:</text>
    <text x="20" y="130" font-family="sans-serif" font-size="12" fill="#94A3B8">text_blocks:</text>
    <text x="20" y="148" font-family="sans-serif" font-size="12" fill="#94A3B8">quality_policy:</text>
  </g>
  <g transform="translate(320 165)">
    <line x1="0" y1="15" x2="80" y2="15" stroke="#1f6feb" stroke-width="3" marker-end="url(#arr)"/>
    <text x="40" y="6" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569" font-weight="600">i2w template render</text>
  </g>
  <g transform="translate(420 100)">
    <rect width="260" height="160" rx="14" fill="#F8FAFC" stroke="#1f6feb" stroke-width="2"/>
    <text x="20" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#1f6feb">STAGE 2</text>
    <text x="20" y="60" font-family="sans-serif" font-size="22" font-weight="800" fill="#0E2A4D">prompt.md</text>
    <line x1="20" y1="74" x2="240" y2="74" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="20" y="86" width="80" height="8" rx="2" fill="#1f6feb"/>
    <rect x="20" y="100" width="220" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="110" width="200" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="120" width="160" height="5" rx="2" fill="#CBD5E1"/>
    <rect x="20" y="134" width="60" height="8" rx="2" fill="#14b8a6"/>
    <rect x="20" y="148" width="220" height="5" rx="2" fill="#CBD5E1"/>
    <text x="20" y="178" font-family="sans-serif" font-size="11" fill="#475569" font-style="italic">paste-ready · API-ready · bilingual</text>
  </g>
  <g transform="translate(700 165)">
    <line x1="0" y1="15" x2="80" y2="15" stroke="#1f6feb" stroke-width="3" marker-end="url(#arr)"/>
    <text x="40" y="6" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#475569" font-weight="600">i2w render generate</text>
    <text x="40" y="36" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#475569">+ preflight + cost</text>
  </g>
  <g transform="translate(800 100)">
    <rect width="180" height="160" rx="14" fill="#1f6feb"/>
    <text x="16" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#14b8a6">STAGE 3a</text>
    <text x="16" y="60" font-family="sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">image.png</text>
    <rect x="16" y="74" width="148" height="72" rx="8" fill="#0E2A4D"/>
    <circle cx="90" cy="110" r="22" fill="#14b8a6"/>
    <text x="90" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="800" fill="#0E2A4D">PNG</text>
  </g>
  <g transform="translate(1000 100)">
    <rect width="160" height="160" rx="14" fill="#0E2A4D" stroke="#14b8a6" stroke-width="2"/>
    <text x="16" y="32" font-family="sans-serif" font-size="14" font-weight="700" fill="#14b8a6">STAGE 3b</text>
    <text x="16" y="60" font-family="sans-serif" font-size="18" font-weight="800" fill="#F8FAFC">ledger</text>
    <text x="16" y="84" font-family="sans-serif" font-size="11" fill="#94A3B8">success_rate</text>
    <text x="16" y="102" font-family="sans-serif" font-size="11" fill="#94A3B8">p95_latency</text>
    <text x="16" y="120" font-family="sans-serif" font-size="11" fill="#94A3B8">cost_usd</text>
    <text x="16" y="138" font-family="sans-serif" font-size="11" fill="#94A3B8">snapshot_id</text>
  </g>
  <line x1="890" y1="180" x2="1000" y2="180" stroke="#14b8a6" stroke-width="2" marker-end="url(#arr)"/>
</svg>
